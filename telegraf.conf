# Telegraf Configuration for AVI Load Balancer (NSX ALB) to Kentik Integration
#
# Verified against AVI Controller 22.1.4 (live).
#
# AUTH + MULTI-TENANT COLLECTION:
# Telegraf runs a helper script via inputs.exec. The script logs in once with
# POST /login, discovers tenants dynamically via paginated GET /api/tenant, then polls
# virtualservice, pool, serviceengine, and controller analytics once per tenant
# using the same session cookie (with scope fallback for compatibility). The script
# emits final Influx line protocol.

[global_tags]
  vendor = "VMware"
  product = "AVI_Load_Balancer"
  environment = "${ENVIRONMENT}"
  location = "${LOCATION}"
  # Identify the AVI device on every record sent to Kentik.
  device_name = "${AVI_DEVICE_NAME}"
  ip_address = "${AVI_CONTROLLER_IP}"

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  hostname = ""
  omit_hostname = false

###############################################################################
#                            INPUT PLUGINS                                     #
###############################################################################

[[inputs.exec]]
  commands = ["python3 /etc/telegraf/avi-tenant-metrics.py"]
  timeout = "55s"
  data_format = "influx"

###############################################################################
#                            OUTPUT PLUGINS                                    #
###############################################################################

# Optional local debug sink (line protocol to stdout + file). Disabled by
# default: metrics already ship to Kentik below, and the bind-mounted file grew
# unbounded (multi-GB) on long-running deployments. Uncomment to debug locally;
# rotation caps the file if you do.
# [[outputs.file]]
#   files = ["stdout", "/var/log/telegraf/avi-metrics.out"]
#   data_format = "influx"
#   influx_sort_fields = false
#   rotation_max_size = "50MB"
#   rotation_max_archives = 3

# Kentik NMS
[[outputs.http]]
  url = "${KENTIK_API_ENDPOINT}"
  data_format = "influx"
  influx_sort_fields = false
  timeout = "30s"
  method = "POST"
  [outputs.http.headers]
    X-CH-Auth-Email = "${KENTIK_API_EMAIL}"
    X-CH-Auth-API-Token = "${KENTIK_API_TOKEN}"
    Content-Type = "application/influx"
