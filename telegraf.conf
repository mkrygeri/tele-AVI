# Telegraf Configuration for AVI Load Balancer to Kentik Integration
# Based on AVI Load Balancer API documentation and Kentik best practices

[global_tags]
  # Add global tags to identify your AVI environment
  vendor = "VMware"
  product = "AVI_Load_Balancer"
  environment = "${ENVIRONMENT}"  # Set via environment variable (dev, staging, prod)
  location = "${LOCATION}"        # Set via environment variable

[agent]
  ## Default data collection interval for all inputs
  interval = "60s"
  ## Rounds collection interval to 'interval'
  round_interval = true
  ## Telegraf will send metrics to outputs in batches of at most
  ## metric_batch_size metrics.
  metric_batch_size = 1000
  ## Maximum number of unwritten metrics per output.
  metric_buffer_limit = 10000
  ## Collection jitter is used to jitter the collection by a random amount.
  collection_jitter = "0s"
  ## Default flushing interval for all outputs.
  flush_interval = "10s"
  ## Jitter the flush interval by a random amount.
  flush_jitter = "0s"
  ## By default or when set to "0s", precision will be set to the same
  ## timestamp order as the collection interval
  precision = ""
  ## Log at debug level.
  debug = false
  ## Log only error level messages.
  quiet = false
  ## Override default hostname, if empty use os.Hostname()
  hostname = ""
  ## If set to true, do no set the "host" tag in the telegraf agent.
  omit_hostname = false

###############################################################################
#                            INPUT PLUGINS                                   #
###############################################################################

# AVI Controller Virtual Service Metrics
[[inputs.http]]
  name_override = "avi_virtualservice_metrics"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/virtualservice?metric_id=l4_server.avg_complete_conns,l4_server.avg_new_established_conns,l4_server.avg_pool_complete_conns,l4_server.avg_pool_new_established_conns,l7_server.avg_complete_responses,l7_server.avg_client_complete_requests&step=300&limit=1"]
  method = "GET"
  timeout = "30s"
  
  ## HTTP Basic Auth
  username = "${AVI_USERNAME}"
  password = "${AVI_PASSWORD}"
  
  ## Optional TLS Config (commented out for testing with self-signed certs)
  # tls_ca = "/path/to/ca.pem"
  # tls_cert = "/path/to/cert.pem"
  # tls_key = "/path/to/key.pem"
  insecure_skip_verify = true
  
  ## Data format to consume
  data_format = "json_v2"
  
  # Exclude url and host from tags to reduce cardinality
  tagexclude = ["url", "host"]
  
  [[inputs.http.json_v2]]
    measurement_name = "avi_virtualservice"
    
    # Virtual Service identification tags
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.virtualservice_name"
      type = "string"
      rename = "vs_name"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.virtualservice_uuid"
      type = "string"
      rename = "vs_uuid"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.tenant"
      type = "string"
      rename = "tenant"
    
    # Virtual Service metrics as fields
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "connections_avg_complete"
    
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float" 
      rename = "connections_avg_new_established"
    
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "pool_connections_avg_complete"
    
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "pool_connections_avg_new_established"
    
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "responses_avg_complete"
    
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "requests_avg_complete"

