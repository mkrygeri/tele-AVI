###############################################################################
#                            OUTPUT PLUGINS                                  #
###############################################################################

# Output to file for debugging (optional)
[[outputs.file]]
  ## Files to write to, "stdout" is a specially handled file.
  files = ["stdout", "/var/log/telegraf/avi-metrics.out"]
  ## Data format to output.
  data_format = "influx"
  influx_sort_fields = false

# Output to Kentik NMS
[[outputs.http]]
  ## URL is the address to send metrics to
  url = "${KENTIK_API_ENDPOINT}"
  ## Data format to output.
  data_format = "influx"
  influx_sort_fields = false
  ## Timeout for HTTP messages.
  timeout = "30s"
  ## HTTP method, one of: "POST" or "PUT"
  method = "POST"
  
  ## Additional HTTP headers
  [outputs.http.headers]
    ## Authentication headers for Kentik
    X-CH-Auth-Email = "${KENTIK_API_EMAIL}"
    X-CH-Auth-API-Token = "${KENTIK_API_TOKEN}"
    Content-Type = "application/influx"

###############################################################################
#                            PROCESSOR PLUGINS                               #
###############################################################################

# Add additional tags and rename fields if needed
[[processors.rename]]
  ## Rename measurements, tags, and fields
  [[processors.rename.replace]]
    measurement = "avi_virtualservice_metrics"
    dest = "avi_virtualservice"
  
  [[processors.rename.replace]]
    measurement = "avi_pool_metrics"
    dest = "avi_pool"
  
  [[processors.rename.replace]]
    measurement = "avi_serviceengine_metrics"
    dest = "avi_serviceengine"
  
  [[processors.rename.replace]]
    measurement = "avi_controller_metrics"
    dest = "avi_controller"

# Add timestamp processing if needed
[[processors.date]]
  ## New tag to create
  tag_key = "collection_hour"
  ## Date format string, must be a representation of the Go "reference time"
  date_format = "15"
  ## Timezone to use when creating the tag
  timezone = "UTC"
