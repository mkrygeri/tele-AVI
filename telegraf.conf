# Telegraf Configuration for AVI Load Balancer (NSX ALB) to Kentik Integration
#
# Verified against AVI Controller 22.1.4 (live).
#
# AUTH: The AVI API does NOT support HTTP Basic Auth by default
# (systemconfiguration.portal_configuration.allow_basic_authentication = false).
# Telegraf authenticates with AVI's session login using the native http-input
# cookie auth: it POSTs credentials to /login, stores the session cookie, and
# reuses it for the metric GETs. GET requests to /api/analytics/... need only
# the session cookie (no CSRF token).
#
# RESPONSE SHAPE (see swagger/metrics.yaml -> MetricsQueryResponse):
#   { "results": [ { "entity_uuid": "..",
#       "series": [ { "header": { "name": "<metric_id>", "units": "..",
#                                 "entity_uuid": "..", "pool_uuid": "..",
#                                 "serviceengine_uuid": "..", "server": ".." },
#                     "data":   [ { "timestamp": "..", "value": N } ] } ] } ] }
# Parsed in long format with json_v2 `object` (results.#.series|@flatten) so each
# metric's name stays bound to its own value; keys are cleaned by processors.rename.

[global_tags]
  vendor = "VMware"
  product = "AVI_Load_Balancer"
  environment = "${ENVIRONMENT}"
  location = "${LOCATION}"
  # Identify the AVI device on every record sent to Kentik.
  device_name = "${AVI_DEVICE_NAME}"
  ip_address = "${AVI_CONTROLLER_IP}"

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  hostname = ""
  omit_hostname = false

###############################################################################
#                            INPUT PLUGINS                                     #
###############################################################################
# All input blocks share the same AVI session-login (cookie) auth and the same
# json_v2 object parser; only the URL/metric_ids and measurement name differ.

# --- Virtual Service metrics -------------------------------------------------
[[inputs.http]]
  name_override = "/devices/avi/virtualservice"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/virtualservice?metric_id=l4_server.avg_complete_conns,l4_server.avg_new_established_conns,l4_server.avg_pool_complete_conns,l4_server.avg_pool_new_established_conns,l7_server.avg_complete_responses,l7_server.avg_client_complete_requests&step=300&limit=1&include_name=true"]
  method = "GET"
  timeout = "30s"
  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url"]

  cookie_auth_url = "https://${AVI_CONTROLLER_IP}/login"
  cookie_auth_method = "POST"
  cookie_auth_body = '{"username":"${AVI_USERNAME}","password":"${AVI_PASSWORD}"}'
  cookie_auth_renewal = "55m"
  cookie_auth_headers = {Content-Type = "application/json"}

  [[inputs.http.json_v2]]
    measurement_name = "/devices/avi/virtualservice"
    [[inputs.http.json_v2.object]]
      path = "results.#.series|@flatten"
      tags = ["header_name", "header_entity_uuid"]
      timestamp_key = "data_timestamp"
      timestamp_format = "2006-01-02T15:04:05Z07:00"
      included_keys = ["data_value"]

