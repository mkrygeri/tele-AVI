name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test mock AVI server
      run: |
        python test-mock-avi.py &
        sleep 5
        pkill -f mock-avi-server.py || true
    
    - name: Validate Telegraf configuration
      run: |
        docker run --rm -v $(pwd)/telegraf.conf:/telegraf.conf telegraf:1.29-alpine telegraf --config /telegraf.conf --test
    
    - name: Build Docker images
      run: |
        docker-compose -f docker-compose.testing.yml build
    
    - name: Test Docker environment
      run: |
        docker-compose -f docker-compose.testing.yml up -d
        sleep 30
        docker-compose -f docker-compose.testing.yml ps
        docker-compose -f docker-compose.testing.yml logs
        docker-compose -f docker-compose.testing.yml down

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security scan
      uses: securecodewarrior/github-action-add-sarif@v1
      with:
        sarif-file: 'security-scan-results.sarif'
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
    
    - name: Lint Python code
      run: |
        flake8 *.py --max-line-length=88
        black --check *.py
    
    - name: Validate Docker Compose files
      run: |
        docker-compose -f docker-compose.yml config
        docker-compose -f docker-compose.testing.yml config
