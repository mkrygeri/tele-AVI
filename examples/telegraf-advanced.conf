# Advanced Telegraf Configuration for AVI to Kentik Integration
# Full four-entity collection (virtualservice, pool, serviceengine, controller)
# using the same session-cookie auth, json_v2 object parser, and wide-format
# pipeline as the main telegraf.conf, plus extra tags, internal self-monitoring,
# and additional output options.

[global_tags]
  vendor = "VMware"
  product = "AVI_Load_Balancer"
  environment = "${ENVIRONMENT}"
  location = "${LOCATION}"
  device_name = "${AVI_DEVICE_NAME}"
  ip_address = "${AVI_CONTROLLER_IP}"
  datacenter = "${DATACENTER}"
  cluster = "${CLUSTER_NAME}"

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 50000
  collection_jitter = "5s"
  flush_interval = "10s"
  flush_jitter = "5s"
  precision = ""
  hostname = ""
  omit_hostname = false
  debug = false
  quiet = false
  logfile = "/var/log/telegraf/telegraf.log"

###############################################################################
#                            INPUT PLUGINS                                     #
###############################################################################
# All inputs share AVI session-login (cookie) auth and the json_v2 object parser;
# only the URL/metric_ids and measurement name differ.

# --- Virtual Service metrics -------------------------------------------------
[[inputs.http]]
  name_override = "/devices/avi/virtualservice"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/virtualservice?metric_id=l4_server.avg_complete_conns,l4_server.avg_new_established_conns,l4_server.avg_pool_complete_conns,l4_server.avg_pool_new_established_conns,l7_server.avg_complete_responses,l7_server.avg_client_complete_requests&step=300&limit=1&include_name=true"]
  method = "GET"
  timeout = "30s"
  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url"]

  cookie_auth_url = "https://${AVI_CONTROLLER_IP}/login"
  cookie_auth_method = "POST"
  cookie_auth_body = '{"username":"${AVI_USERNAME}","password":"${AVI_PASSWORD}"}'
  cookie_auth_renewal = "55m"
  cookie_auth_headers = {Content-Type = "application/json"}

  [[inputs.http.json_v2]]
    measurement_name = "/devices/avi/virtualservice"
    [[inputs.http.json_v2.object]]
      path = "results.#.series|@flatten"
      tags = ["header_name", "header_entity_uuid"]
      timestamp_key = "data_timestamp"
      timestamp_format = "2006-01-02T15:04:05Z07:00"
      included_keys = ["data_value"]

# --- Pool metrics ------------------------------------------------------------
[[inputs.http]]
  name_override = "/devices/avi/pool"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/pool?metric_id=l4_server.avg_complete_conns,l4_server.avg_new_established_conns,l4_server.avg_pool_open_conns,l4_server.sum_connection_errors&step=300&limit=1&include_name=true"]
  method = "GET"
  timeout = "30s"
  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url"]

  cookie_auth_url = "https://${AVI_CONTROLLER_IP}/login"
  cookie_auth_method = "POST"
  cookie_auth_body = '{"username":"${AVI_USERNAME}","password":"${AVI_PASSWORD}"}'
  cookie_auth_renewal = "55m"
  cookie_auth_headers = {Content-Type = "application/json"}

  [[inputs.http.json_v2]]
    measurement_name = "/devices/avi/pool"
    [[inputs.http.json_v2.object]]
      path = "results.#.series|@flatten"
      tags = ["header_name", "header_entity_uuid"]
      timestamp_key = "data_timestamp"
      timestamp_format = "2006-01-02T15:04:05Z07:00"
      included_keys = ["data_value"]

# --- Service Engine metrics --------------------------------------------------
[[inputs.http]]
  name_override = "/devices/avi/serviceengine"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/serviceengine?metric_id=se_stats.avg_cpu_usage,se_stats.avg_mem_usage,se_stats.avg_disk_usage,se_if.avg_bandwidth&step=300&limit=1&include_name=true"]
  method = "GET"
  timeout = "30s"
  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url"]

  cookie_auth_url = "https://${AVI_CONTROLLER_IP}/login"
  cookie_auth_method = "POST"
  cookie_auth_body = '{"username":"${AVI_USERNAME}","password":"${AVI_PASSWORD}"}'
  cookie_auth_renewal = "55m"
  cookie_auth_headers = {Content-Type = "application/json"}

  [[inputs.http.json_v2]]
    measurement_name = "/devices/avi/serviceengine"
    [[inputs.http.json_v2.object]]
      path = "results.#.series|@flatten"
      tags = ["header_name", "header_entity_uuid"]
      timestamp_key = "data_timestamp"
      timestamp_format = "2006-01-02T15:04:05Z07:00"
      included_keys = ["data_value"]

# --- Controller metrics ------------------------------------------------------
# Full controller_stats.* set (health, capacity, throughput, license usage, disk).
[[inputs.http]]
  name_override = "/devices/avi/controller"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/controller?metric_id=controller_stats.avg_cpu_usage,controller_stats.avg_mem_usage,controller_stats.avg_disk_usage,controller_stats.avg_disk_read_bytes,controller_stats.avg_disk_write_bytes,controller_stats.avg_num_active_vs,controller_stats.max_num_active_vs,controller_stats.avg_num_ses,controller_stats.max_num_ses,controller_stats.avg_num_se_cores,controller_stats.max_num_se_cores,controller_stats.avg_num_service_cores,controller_stats.max_num_service_cores,controller_stats.avg_num_sockets,controller_stats.max_num_sockets,controller_stats.avg_num_backend_servers,controller_stats.max_num_backend_servers,controller_stats.avg_total_se_throughput,controller_stats.max_total_se_throughput,controller_stats.sum_total_se_bytes,controller_stats.sum_total_vs_bytes,controller_stats.sum_total_vs_client_bytes,controller_stats.sum_total_vs_usage,controller_stats.max_num_active_vs_lic_usage,controller_stats.max_num_ses_lic_usage,controller_stats.max_num_sockets_lic_usage,controller_stats.max_num_service_cores_lic_usage,controller_stats.max_se_cores_lic_usage,controller_stats.max_se_throughput_lic_usage,controller_stats.max_be_servers_lic_usage&step=300&limit=1&include_name=true"]
  method = "GET"
  timeout = "30s"
  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url"]

  cookie_auth_url = "https://${AVI_CONTROLLER_IP}/login"
  cookie_auth_method = "POST"
  cookie_auth_body = '{"username":"${AVI_USERNAME}","password":"${AVI_PASSWORD}"}'
  cookie_auth_renewal = "55m"
  cookie_auth_headers = {Content-Type = "application/json"}

  [[inputs.http.json_v2]]
    measurement_name = "/devices/avi/controller"
    [[inputs.http.json_v2.object]]
      path = "results.#.series|@flatten"
      tags = ["header_name", "header_entity_uuid"]
      timestamp_key = "data_timestamp"
      timestamp_format = "2006-01-02T15:04:05Z07:00"
      included_keys = ["data_value"]

# Internal Telegraf self-monitoring (agent/output health).
[[inputs.internal]]
  collect_memstats = true

###############################################################################
#                       PROCESSOR & AGGREGATOR PLUGINS                         #
###############################################################################
[[processors.rename]]
  namepass = ["/devices/avi/*"]
  [[processors.rename.replace]]
    tag = "header_entity_uuid"
    dest = "entity_uuid"

# Drop the redundant "controller_stats." prefix, then make keys Kentik-friendly.
[[processors.strings]]
  namepass = ["/devices/avi/*"]
  [[processors.strings.trim_prefix]]
    tag = "header_name"
    prefix = "controller_stats."
  [[processors.strings.replace]]
    tag = "header_name"
    old = "."
    new = "_"

[[processors.pivot]]
  namepass = ["/devices/avi/*"]
  tag_key = "header_name"
  value_key = "data_value"

[[aggregators.merge]]
  namepass = ["/devices/avi/*"]
  period = "10s"
  grace = "5s"
  drop_original = true

###############################################################################
#                            OUTPUT PLUGINS                                    #
###############################################################################

# Primary output to Kentik.
[[outputs.http]]
  url = "${KENTIK_API_ENDPOINT}"
  data_format = "influx"
  influx_sort_fields = false
  timeout = "30s"
  method = "POST"
  namepass = ["/devices/avi/*"]
  [outputs.http.headers]
    X-CH-Auth-Email = "${KENTIK_API_EMAIL}"
    X-CH-Auth-API-Token = "${KENTIK_API_TOKEN}"
    Content-Type = "application/influx"
    User-Agent = "telegraf-avi-integration/1.0"

# Debug output to file (line protocol).
[[outputs.file]]
  files = ["/var/log/telegraf/avi-metrics.out"]
  data_format = "influx"
  influx_sort_fields = false
  namepass = ["/devices/avi/*"]

