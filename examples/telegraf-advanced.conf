# Advanced Telegraf Configuration for AVI to Kentik Integration
# This configuration includes advanced features like:
# - Multiple outputs
# - Advanced processing
# - Custom metrics
# - Enhanced monitoring

[global_tags]
  vendor = "VMware"
  product = "AVI_Load_Balancer"
  environment = "${ENVIRONMENT}"
  location = "${LOCATION}"
  datacenter = "${DATACENTER}"
  cluster = "${CLUSTER_NAME}"

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 50000
  collection_jitter = "10s"
  flush_interval = "10s"
  flush_jitter = "5s"
  precision = ""
  hostname = ""
  omit_hostname = false
  debug = false
  quiet = false
  logfile = "/var/log/telegraf/telegraf.log"

# Extended Virtual Service Metrics
[[inputs.http]]
  name_override = "avi_virtualservice_extended"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/virtualservice?metric_id=l4_server.avg_complete_conns,l4_server.avg_new_established_conns,l4_server.avg_bandwidth,l7_server.avg_complete_responses,l7_server.avg_client_complete_requests,l7_server.avg_client_data_transfer_time,l7_server.sum_server_errors&step=300&limit=10"]
  method = "GET"
  timeout = "60s"
  interval = "30s"
  username = "${AVI_USERNAME}"
  password = "${AVI_PASSWORD}"
  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url", "host"]

  [[inputs.http.json_v2]]
    measurement_name = "avi_virtualservice"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.virtualservice_name"
      type = "string"
      rename = "vs_name"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.virtualservice_uuid"
      type = "string"
      rename = "vs_uuid"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.tenant"
      type = "string"
      rename = "tenant"
    
    # Multiple field mappings for different metrics
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "connections_complete"
    
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "bandwidth_avg_bps"
    
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "server_errors_sum"

# Pool Health Monitoring
[[inputs.http]]
  name_override = "avi_pool_health"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/pool?metric_id=l4_server.avg_complete_conns,l4_server.sum_connection_errors,l4_server.sum_connection_drops&step=300&limit=20"]
  method = "GET"
  timeout = "60s"
  interval = "60s"
  username = "${AVI_USERNAME}"
  password = "${AVI_PASSWORD}"
  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url", "host"]

  [[inputs.http.json_v2]]
    measurement_name = "avi_pool_health"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.pool_name"
      type = "string"
      rename = "pool_name"
    
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "health_score"

# Custom AVI System Metrics
[[inputs.http]]
  name_override = "avi_system_metrics"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/controller?metric_id=controller_stats.avg_cpu_usage,controller_stats.avg_mem_usage,controller_stats.avg_disk_usage,system_stats.avg_network_usage&step=300&limit=5"]
  method = "GET"
  timeout = "45s"
  interval = "120s"
  username = "${AVI_USERNAME}"
  password = "${AVI_PASSWORD}"
  insecure_skip_verify = true
  data_format = "json_v2"

  [[inputs.http.json_v2]]
    measurement_name = "avi_system"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.controller_name"
      type = "string"
      rename = "controller_name"

# Internal Telegraf monitoring
[[inputs.internal]]
  collect_memstats = true

###############################################################################
#                            PROCESSOR PLUGINS                               #
###############################################################################

# Add calculated fields
[[processors.converter]]
  [processors.converter.fields]
    float = ["*_percent", "*_ratio", "*_bps"]
    integer = ["*_count", "*_sum", "*_errors"]

# Rate calculations
[[processors.derivative]]
  namepass = ["avi_*"]
  variable = "rate_"
  suffix = "_per_sec"

# Add SLA calculations
[[processors.starlark]]
  script = '''
def apply(metric):
    # Calculate SLA based on error rate
    if hasattr(metric, 'fields') and 'server_errors_sum' in metric.fields:
        error_rate = metric.fields['server_errors_sum']
        if error_rate < 1:
            metric.fields['sla_status'] = 'excellent'
        elif error_rate < 10:
            metric.fields['sla_status'] = 'good'
        else:
            metric.fields['sla_status'] = 'poor'
    return metric
'''

# Rename measurements for consistency
[[processors.rename]]
  [[processors.rename.replace]]
    measurement = "avi_virtualservice_extended"
    dest = "avi_virtualservice"
  
  [[processors.rename.replace]]
    measurement = "avi_pool_health"
    dest = "avi_pool"

###############################################################################
#                            OUTPUT PLUGINS                                  #
###############################################################################

# Primary output to Kentik
[[outputs.http]]
  url = "${KENTIK_API_ENDPOINT}"
  data_format = "influx"
  influx_sort_fields = false
  timeout = "30s"
  method = "POST"
  
  [outputs.http.headers]
    X-CH-Auth-Email = "${KENTIK_API_EMAIL}"
    X-CH-Auth-API-Token = "${KENTIK_API_TOKEN}"
    Content-Type = "application/influx"
    User-Agent = "telegraf-avi-integration/1.0"

