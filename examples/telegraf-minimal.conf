# Minimal Telegraf Configuration for AVI to Kentik Integration
# This is a simplified version for testing or minimal deployments

[global_tags]
  vendor = "VMware"
  product = "AVI_Load_Balancer"
  environment = "${ENVIRONMENT}"
  location = "${LOCATION}"

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  precision = ""
  hostname = ""
  omit_hostname = false

# Simple Virtual Service Metrics Collection
[[inputs.http]]
  name_override = "avi_virtualservice"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/virtualservice?metric_id=l4_server.avg_complete_conns,l7_server.avg_complete_responses&step=300&limit=1"]
  method = "GET"
  timeout = "30s"
  username = "${AVI_USERNAME}"
  password = "${AVI_PASSWORD}"
  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url", "host"]

  [[inputs.http.json_v2]]
    measurement_name = "avi_virtualservice"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.virtualservice_name"
      type = "string"
      rename = "vs_name"
    
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "connections_complete"

# Output to console for testing
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"

