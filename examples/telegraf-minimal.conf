# Minimal Telegraf Configuration for AVI to Kentik Integration
# Simplified single-entity (controller) example. Uses the same session-cookie
# auth, json_v2 object parser, and wide-format pipeline as the main telegraf.conf.

[global_tags]
  vendor = "VMware"
  product = "AVI_Load_Balancer"
  environment = "${ENVIRONMENT}"
  location = "${LOCATION}"
  device_name = "${AVI_DEVICE_NAME}"
  ip_address = "${AVI_CONTROLLER_IP}"

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  precision = ""
  hostname = ""
  omit_hostname = false

# Controller metrics (health only). AVI requires session login (no Basic Auth):
# Telegraf POSTs to /login, stores the cookie, and reuses it for the metric GETs.
[[inputs.http]]
  name_override = "/devices/avi/controller"
  urls = ["https://${AVI_CONTROLLER_IP}/api/analytics/metrics/controller?metric_id=controller_stats.avg_cpu_usage,controller_stats.avg_mem_usage,controller_stats.avg_disk_usage&step=300&limit=1&include_name=true"]
  method = "GET"
  timeout = "30s"
  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url"]

  cookie_auth_url = "https://${AVI_CONTROLLER_IP}/login"
  cookie_auth_method = "POST"
  cookie_auth_body = '{"username":"${AVI_USERNAME}","password":"${AVI_PASSWORD}"}'
  cookie_auth_renewal = "55m"
  cookie_auth_headers = {Content-Type = "application/json"}

  [[inputs.http.json_v2]]
    measurement_name = "/devices/avi/controller"
    [[inputs.http.json_v2.object]]
      path = "results.#.series|@flatten"
      tags = ["header_name", "header_entity_uuid"]
      timestamp_key = "data_timestamp"
      timestamp_format = "2006-01-02T15:04:05Z07:00"
      included_keys = ["data_value"]

# Pivot each metric name into its own field, merge into one wide record per entity.
[[processors.rename]]
  [[processors.rename.replace]]
    tag = "header_entity_uuid"
    dest = "entity_uuid"

# Drop the redundant "controller_stats." prefix, then make keys Kentik-friendly.
[[processors.strings]]
  [[processors.strings.trim_prefix]]
    tag = "header_name"
    prefix = "controller_stats."
  [[processors.strings.replace]]
    tag = "header_name"
    old = "."
    new = "_"

[[processors.pivot]]
  tag_key = "header_name"
  value_key = "data_value"

[[aggregators.merge]]
  period = "10s"
  grace = "5s"
  drop_original = true

# Output to console for testing.
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
  influx_sort_fields = false

