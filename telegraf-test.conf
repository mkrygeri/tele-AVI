# Telegraf Test Configuration for Mock AVI Load Balancer
# This configuration works with the local mock server for testing

[global_tags]
  vendor = "VMware"
  product = "AVI_Load_Balancer"
  environment = "testing"
  location = "mock-environment"

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = true
  quiet = false
  hostname = ""
  omit_hostname = false

###############################################################################
#                            INPUT PLUGINS                                   #
###############################################################################

# Mock AVI Controller Virtual Service Metrics
[[inputs.http]]
  name_override = "avi_virtualservice"
  urls = ["https://localhost:8443/api/analytics/metrics/virtualservice?metric_id=l4_server.avg_complete_conns,l4_server.avg_new_established_conns,l4_server.avg_pool_complete_conns,l4_server.avg_pool_new_established_conns,l7_server.avg_complete_responses,l7_server.avg_client_complete_requests&step=300&limit=1"]
  method = "GET"
  timeout = "30s"
  
  ## HTTP Basic Auth for mock server
  username = "admin"
  password = "admin123"
  
  ## Skip TLS verification for mock server
  insecure_skip_verify = true
  
  ## Data format to consume
  data_format = "json_v2"
  
  # Exclude url and host from tags to reduce cardinality
  tagexclude = ["url", "host"]
  
  [[inputs.http.json_v2]]
    measurement_name = "avi_virtualservice"
    
    # Virtual Service identification tags
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.virtualservice_name"
      type = "string"
      rename = "vs_name"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.virtualservice_uuid"
      type = "string"
      rename = "vs_uuid"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.tenant"
      type = "string"
      rename = "tenant"
    
    # Virtual Service metrics as fields
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "connections_avg_complete"

# Mock AVI Controller Pool Metrics
[[inputs.http]]
  name_override = "avi_pool"
  urls = ["https://localhost:8443/api/analytics/metrics/pool?metric_id=l4_server.avg_complete_conns,l4_server.avg_new_established_conns,l4_server.avg_pool_open_conns,l4_server.sum_connection_errors&step=300&limit=1"]
  method = "GET"
  timeout = "30s"
  
  username = "admin"
  password = "admin123"
  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url", "host"]
  
  [[inputs.http.json_v2]]
    measurement_name = "avi_pool"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.pool_name"
      type = "string"
      rename = "pool_name"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.pool_uuid"
      type = "string"
      rename = "pool_uuid"
    
    [[inputs.http.json_v2.tag]]
      path = "series.#.tags.tenant"
      type = "string"
      rename = "tenant"
    
    [[inputs.http.json_v2.field]]
      path = "series.#.data.#.value"
      type = "float"
      rename = "pool_connections_avg_complete"

###############################################################################
#                            OUTPUT PLUGINS                                  #
###############################################################################

# Output to console and file for testing
[[outputs.file]]
  files = ["stdout", "./test-metrics.out"]
  data_format = "influx"
  influx_sort_fields = false
