# Telegraf Test Configuration for Mock AVI Load Balancer
# Uses the dynamic multi-tenant collector script against https://localhost:8443.

[global_tags]
  vendor = "VMware"
  product = "AVI_Load_Balancer"
  environment = "testing"
  location = "mock-environment"
  device_name = "mock-avi"
  ip_address = "localhost"

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = true
  quiet = false
  hostname = ""
  omit_hostname = false

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

[[inputs.exec]]
  commands = ["python3 /etc/telegraf/avi-tenant-metrics.py"]
  timeout = "25s"
  data_format = "influx"
  environment = [
    "AVI_CONTROLLER_IP=localhost:8443",
    "AVI_USERNAME=admin",
    "AVI_PASSWORD=admin123",
    "AVI_INSECURE_SKIP_VERIFY=true",
    "AVI_TENANT_SCOPE_MODE=auto",
    "AVI_TOTAL_TIMEOUT_SECONDS=20",
    "AVI_REQUEST_TIMEOUT_SECONDS=8"
  ]

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

# Output to console and file for testing
[[outputs.file]]
  files = ["stdout", "./test-metrics.out"]
  data_format = "influx"
  influx_sort_fields = false
