# Telegraf Test Configuration for Mock AVI Load Balancer
# Mirrors telegraf.conf but targets the local mock server (https://localhost:8443)
# with hardcoded test credentials and console/file output instead of Kentik.
#
# AUTH: The AVI API does NOT support HTTP Basic Auth for analytics by default.
# Telegraf logs in via POST /login (JSON body) and reuses the session cookie.
# The mock accepts the same session login (admin:admin123).

[global_tags]
  vendor = "VMware"
  product = "AVI_Load_Balancer"
  environment = "testing"
  location = "mock-environment"
  device_name = "mock-avi"
  ip_address = "localhost"

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = true
  quiet = false
  hostname = ""
  omit_hostname = false

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# Virtual Service metrics
[[inputs.http]]
  name_override = "/devices/avi/virtualservice"
  urls = ["https://localhost:8443/api/analytics/metrics/virtualservice?metric_id=l4_server.avg_complete_conns,l4_server.avg_new_established_conns,l4_server.avg_pool_complete_conns,l4_server.avg_pool_new_established_conns,l7_server.avg_complete_responses,l7_server.avg_client_complete_requests&step=300&limit=1&include_name=true"]
  method = "GET"
  timeout = "30s"

  cookie_auth_url = "https://localhost:8443/login"
  cookie_auth_method = "POST"
  cookie_auth_body = '{"username":"admin","password":"admin123"}'
  cookie_auth_renewal = "55m"
  cookie_auth_headers = {Content-Type = "application/json"}

  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "results.#.series|@flatten"
      tags = ["header_name", "header_entity_uuid"]
      timestamp_key = "data_timestamp"
      timestamp_format = "2006-01-02T15:04:05Z07:00"
      included_keys = ["data_value"]

# Pool metrics
[[inputs.http]]
  name_override = "/devices/avi/pool"
  urls = ["https://localhost:8443/api/analytics/metrics/pool?metric_id=l4_server.avg_complete_conns,l4_server.avg_new_established_conns,l4_server.avg_pool_open_conns,l4_server.sum_connection_errors&step=300&limit=1&include_name=true"]
  method = "GET"
  timeout = "30s"

  cookie_auth_url = "https://localhost:8443/login"
  cookie_auth_method = "POST"
  cookie_auth_body = '{"username":"admin","password":"admin123"}'
  cookie_auth_renewal = "55m"
  cookie_auth_headers = {Content-Type = "application/json"}

  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "results.#.series|@flatten"
      tags = ["header_name", "header_entity_uuid"]
      timestamp_key = "data_timestamp"
      timestamp_format = "2006-01-02T15:04:05Z07:00"
      included_keys = ["data_value"]

# Service Engine metrics
[[inputs.http]]
  name_override = "/devices/avi/serviceengine"
  urls = ["https://localhost:8443/api/analytics/metrics/serviceengine?metric_id=se_stats.avg_cpu_usage,se_stats.avg_mem_usage,se_stats.avg_disk_usage,se_if.avg_bandwidth&step=300&limit=1&include_name=true"]
  method = "GET"
  timeout = "30s"

  cookie_auth_url = "https://localhost:8443/login"
  cookie_auth_method = "POST"
  cookie_auth_body = '{"username":"admin","password":"admin123"}'
  cookie_auth_renewal = "55m"
  cookie_auth_headers = {Content-Type = "application/json"}

  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "results.#.series|@flatten"
      tags = ["header_name", "header_entity_uuid"]
      timestamp_key = "data_timestamp"
      timestamp_format = "2006-01-02T15:04:05Z07:00"
      included_keys = ["data_value"]

# Controller metrics
[[inputs.http]]
  name_override = "/devices/avi/controller"
  urls = ["https://localhost:8443/api/analytics/metrics/controller?metric_id=controller_stats.avg_cpu_usage,controller_stats.avg_mem_usage,controller_stats.avg_disk_usage&step=300&limit=1&include_name=true"]
  method = "GET"
  timeout = "30s"

  cookie_auth_url = "https://localhost:8443/login"
  cookie_auth_method = "POST"
  cookie_auth_body = '{"username":"admin","password":"admin123"}'
  cookie_auth_renewal = "55m"
  cookie_auth_headers = {Content-Type = "application/json"}

  insecure_skip_verify = true
  data_format = "json_v2"
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "results.#.series|@flatten"
      tags = ["header_name", "header_entity_uuid"]
      timestamp_key = "data_timestamp"
      timestamp_format = "2006-01-02T15:04:05Z07:00"
      included_keys = ["data_value"]

###############################################################################
#                            PROCESSOR PLUGINS                                #
###############################################################################

# Rename the header_entity_uuid tag to entity_uuid
[[processors.rename]]
  [[processors.rename.replace]]
    tag = "header_entity_uuid"
    dest = "entity_uuid"

# Strip the "controller_stats." prefix, then turn dots into underscores so the
# metric names become valid, dot-free field keys.
[[processors.strings]]
  [[processors.strings.trim_prefix]]
    tag = "header_name"
    prefix = "controller_stats."
  [[processors.strings.replace]]
    tag = "header_name"
    old = "."
    new = "_"

# Pivot each metric name into its own field on the record.
[[processors.pivot]]
  tag_key = "header_name"
  value_key = "data_value"

###############################################################################
#                            AGGREGATOR PLUGINS                               #
###############################################################################

# Merge the per-metric records for the same entity into one wide record.
[[aggregators.merge]]
  period = "10s"
  grace = "5s"
  drop_original = true

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

# Output to console and file for testing
[[outputs.file]]
  files = ["stdout", "./test-metrics.out"]
  data_format = "influx"
  influx_sort_fields = false
